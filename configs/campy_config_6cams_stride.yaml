# Video parameters
# Example config with heterogeneous frame stride, 
# keeping triggered frames synchronized 
# but with cameras capturing at different rates
# E.g., pupilometry cameras capture every 5th frame

videoFolder: "./videos"
videoFilename: "0.mp4"
frameRate: 100
frameStride: [1,1,1,1,4,4] # four cameras at 100 fps, two at 25 fps
recTimeInSec: 30

# Camera parameters
numCams: 6
cameraNames: ["Camera1","Camera2","Camera3","Camera4","Camera5","Camera6"]
cameraMake: "basler"
cameraSettings: "./configs/rgb24.pfs" # "./configs/bayer8.pfs" # 
pixelFormatInput: "rgb24" # "bayer_bggr8" # 
pixelFormatOutput: "rgb0"
frameWidth: 1152
frameHeight: 1024

# Compression parameters
ffmpegPath: "C:/Code/ffmpeg/ffmpeg.exe"
ffmpegLogLevel: "warning"               # "quiet", "warning", "info"
gpuID: 0
gpuMake: "nvidia"                     # "nvidia", "amd", "intel"                  
codec: "h265"                         # "h264", "h265", or user-defined video codec
quality: "4M"                           # 0-55
preset: "llhq" # "fast" # "medium" # "slow"
cameraDebug: False

# Display parameters
displayFrameCounter: 1
displayFrameRate: 10
displayDownsample: 3

# Trigger parameters
startArduino: True
serialPort: "COM3"
digitalPins: [0,1,2,3,4,5,6]

